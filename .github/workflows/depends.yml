name: ci/gh-actions/depends

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/README.md'

env:
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF
  CCACHE_SETTINGS: |
        ccache --max-size=150M
  USE_DEVICE_TREZOR_MANDATORY: ON

jobs:
  build-cross:
    runs-on: ubuntu-latest
    container:
      # Every image reference is a tag plus the multi-architecture image index digest the
      # tag resolved to, so the tag cannot be moved under a root job that holds checkout
      # credentials and writes caches. Refresh a tag and its digest together, through a
      # reviewed pull request.
      image: ${{ matrix.toolchain.container || 'ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517' }}
      env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: "RISCV 64bit"
            host: "riscv64-linux-gnu"
            rust_host: "riscv64gc-unknown-linux-gnu"
            packages: "g++-riscv64-linux-gnu"
            # Use GCC 14 or newer for the RISC-V RandomX build
            container: "ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b"
          - name: "ARM v8"
            host: "aarch64-linux-gnu"
            rust_host: "aarch64-unknown-linux-gnu"
            packages: "g++-aarch64-linux-gnu"
          - name: "i686 Linux"
            host: "i686-pc-linux-gnu"
            rust_host: "i686-unknown-linux-gnu"
            packages: "g++-multilib"
          - name: "Win64"
            host: "x86_64-w64-mingw32"
            rust_host: "x86_64-pc-windows-gnu"
            packages: "g++-mingw-w64-x86-64"
          - name: "x86_64 Linux"
            host: "x86_64-unknown-linux-gnu"
            rust_host: "x86_64-unknown-linux-gnu"
          - name: "Cross-Mac x86_64"
            host: "x86_64-apple-darwin"
            rust_host: "x86_64-apple-darwin"
            packages: "clang-19 lld-19"
          - name: "Cross-Mac aarch64"
            host: "arm64-apple-darwin"
            rust_host: "aarch64-apple-darwin"
            packages: "clang-19 lld-19"
          # Built and tested, but not for publication: the pinned FreeBSD 12.3
          # sysroot is end of life, so see docs/COMPILING_DEBUGGING_TESTING.md,
          # "Cross-build dialect exceptions", before shipping this artifact.
          - name: "x86_64 Freebsd"
            host: "x86_64-unknown-freebsd"
            rust_host: "x86_64-unknown-freebsd"
            packages: "clang"
          - name: "ARMv7 Android"
            host: "arm-linux-android"
            rust_host: "armv7-linux-androideabi"
            packages: "unzip"
          - name: "ARMv8 Android"
            host: "aarch64-linux-android"
            rust_host: "aarch64-linux-android"
            packages: "unzip"
    name: ${{ matrix.toolchain.name }}
    steps:
    - name: set apt conf
      run: ${{env.APT_SET_CONF}}
    - name: install packages
      run: apt update; apt -y install ca-certificates curl
    - name: prepare apple-darwin
      if: ${{ matrix.toolchain.host == 'x86_64-apple-darwin' || matrix.toolchain.host == 'arm64-apple-darwin' }}
      run: |
          cat << EOF >> /etc/apt/sources.list
          deb http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main
          deb-src http://apt.llvm.org/noble/ llvm-toolchain-noble-19 main
          EOF
          curl https://apt.llvm.org/llvm-snapshot.gpg.key > /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "/usr/lib/llvm-19/bin/" >> $GITHUB_PATH
    - name: install dependencies
      run: apt update; apt -y install build-essential cmake pkg-config git ccache ${{ matrix.toolchain.packages }}
    - name: install rust
      run: |
          curl -O https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
          echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71 rustup-init" | sha256sum -c
          chmod +x rustup-init
          ./rustup-init -y --default-toolchain 1.93 --target ${{ matrix.toolchain.rust_host }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: configure git
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: recursive
# Most volatile cache
    - name: restore ccache
      uses: actions/cache/restore@v5
      id: ccache-restore
      with:
        path: ~/.cache/ccache
        key: ccache-${{ matrix.toolchain.host }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.toolchain.host }}-
# Less volatile cache
    - name: restore depends cache
      uses: actions/cache/restore@v5
      id: depends-restore
      with:
        path: contrib/depends/built
        # The hashed set must mirror every input the depends build ids are derived from:
        # `meta_depends` (Makefile, funcs.mk, builders/*.mk, hosts/*.mk), each recipe and its
        # patches (funcs.mk, int_get_build_recipe_hash), `toolchain.cmake.in` (folded into
        # final_build_id) and the config canonicalization scripts the recipes copy in. An
        # input that moves a build id without moving this key restores an exact hit, so
        # everything rebuilds and the save step below is skipped by its `cache-hit` guard and
        # the work repeats on every run. Keep the two in sync with the depends machinery.
        key: depends-cxx23-${{ matrix.toolchain.host }}-${{ hashFiles('contrib/depends/packages/*', 'contrib/depends/Makefile', 'contrib/depends/funcs.mk', 'contrib/depends/hosts/*', 'contrib/depends/builders/*', 'contrib/depends/patches/**', 'contrib/depends/toolchain.cmake.in', 'contrib/depends/config.guess', 'contrib/depends/config.sub') }}
        restore-keys: depends-cxx23-${{ matrix.toolchain.host }}-
    - name: prepare w64-mingw32
      if: ${{ matrix.toolchain.host == 'x86_64-w64-mingw32' }}
      run: |
        update-alternatives --set ${{ matrix.toolchain.host }}-g++ $(which ${{ matrix.toolchain.host }}-g++-posix)
        update-alternatives --set ${{ matrix.toolchain.host }}-gcc $(which ${{ matrix.toolchain.host }}-gcc-posix)
    - uses: ./.github/actions/set-make-job-count
    - name: build
      run: |
        ${{env.CCACHE_SETTINGS}}
        make depends target=${{ matrix.toolchain.host }} -j${{env.MAKE_JOB_COUNT}}
    - name: save ccache
      uses: actions/cache/save@v5
      if: github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
    - name: save depends cache
      uses: actions/cache/save@v5
      if: github.event_name != 'pull_request' && steps.depends-restore.outputs.cache-hit != 'true'
      with:
        path: contrib/depends/built
        key: ${{ steps.depends-restore.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v7
      if: ${{ matrix.toolchain.host == 'x86_64-w64-mingw32' || matrix.toolchain.host == 'x86_64-apple-darwin' || matrix.toolchain.host == 'arm64-apple-darwin' || matrix.toolchain.host == 'x86_64-unknown-linux-gnu' }}
      with:
        name: ${{ matrix.toolchain.name }}
        path: |
          build/${{ matrix.toolchain.host }}/release/bin/monero-wallet-cli*
          build/${{ matrix.toolchain.host }}/release/bin/monerod*
