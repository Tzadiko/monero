name: ci/gh-actions/depends

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/README.md'

env:
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF
  CCACHE_SETTINGS: |
        ccache --max-size=150M
  USE_DEVICE_TREZOR_MANDATORY: ON

jobs:
  build-cross:
    runs-on: ubuntu-latest
    container:
      # Digest-pinned so a re-run of a given commit builds in the same image it was tested in.
      # No cache key is keyed on the container here (the depends and ccache keys use
      # matrix.toolchain.host), so the digest can sit inline with the tag.
      image: ${{ matrix.toolchain.container || 'ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517' }}
      env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - name: "RISCV 64bit"
            host: "riscv64-linux-gnu"
            rust_host: "riscv64gc-unknown-linux-gnu"
            packages: "g++-riscv64-linux-gnu"
            container: "ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b" # RandomX v2 requires GCC 14 or above for riscv64
          - name: "ARM v8"
            host: "aarch64-linux-gnu"
            rust_host: "aarch64-unknown-linux-gnu"
            packages: "g++-aarch64-linux-gnu"
          - name: "i686 Linux"
            host: "i686-pc-linux-gnu"
            rust_host: "i686-unknown-linux-gnu"
            packages: "g++-multilib"
          - name: "Win64"
            host: "x86_64-w64-mingw32"
            rust_host: "x86_64-pc-windows-gnu"
            packages: "g++-mingw-w64-x86-64"
          - name: "x86_64 Linux"
            host: "x86_64-unknown-linux-gnu"
            rust_host: "x86_64-unknown-linux-gnu"
          - name: "Cross-Mac x86_64"
            host: "x86_64-apple-darwin"
            rust_host: "x86_64-apple-darwin"
            packages: "clang-19 lld-19"
          - name: "Cross-Mac aarch64"
            host: "arm64-apple-darwin"
            rust_host: "aarch64-apple-darwin"
            packages: "clang-19 lld-19"
          - name: "x86_64 Freebsd"
            host: "x86_64-unknown-freebsd"
            rust_host: "x86_64-unknown-freebsd"
            packages: "clang"
          - name: "ARMv7 Android"
            host: "arm-linux-android"
            rust_host: "armv7-linux-androideabi"
            packages: "unzip"
          - name: "ARMv8 Android"
            host: "aarch64-linux-android"
            rust_host: "aarch64-linux-android"
            packages: "unzip"
    name: ${{ matrix.toolchain.name }}
    steps:
    - name: set apt conf
      run: ${{env.APT_SET_CONF}}
    - name: install packages
      run: apt update; apt -y install ca-certificates curl
    - name: prepare apple-darwin
      if: ${{ matrix.toolchain.host == 'x86_64-apple-darwin' || matrix.toolchain.host == 'arm64-apple-darwin' }}
      # The LLVM archive key is fetched fail-closed, verified by fingerprint, and trusted
      # only for the LLVM repository (signed-by=), over HTTPS. A bare redirect of curl's
      # output into /etc/apt/trusted.gpg.d/ cannot do that: without -f an HTTP error body
      # or a reset connection is written into the trust store and the step still exits 0.
      run: |
          set -euo pipefail
          apt -y install gnupg
          # Fingerprint of the apt.llvm.org archive key (uid "Sylvestre Ledru - Debian LLVM packages").
          LLVM_KEY_FPR=6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
          curl -fsSL --proto '=https' --proto-redir '=https' --retry 3 --retry-connrefused \
            https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/apt.llvm.org.asc
          FPRS=$(gpg --show-keys --with-colons /tmp/apt.llvm.org.asc | awk -F: '$1=="fpr"{print $10}')
          if ! grep -qxF "$LLVM_KEY_FPR" <<< "$FPRS"; then
            echo "::error::apt.llvm.org key fingerprint mismatch (expected $LLVM_KEY_FPR, got: $(tr '\n' ' ' <<< "$FPRS"))"
            exit 1
          fi
          install -D -m 0644 /tmp/apt.llvm.org.asc /usr/share/keyrings/apt.llvm.org.asc
          cat << EOF > /etc/apt/sources.list.d/apt-llvm-org.list
          deb [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main
          deb-src [signed-by=/usr/share/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-19 main
          EOF
          echo "/usr/lib/llvm-19/bin/" >> "$GITHUB_PATH"
    - name: install dependencies
      run: apt update; apt -y install build-essential cmake pkg-config git ccache ${{ matrix.toolchain.packages }}
    - name: install rust
      # Same toolchain pin as build.yml's INSTALL_RUST, reviewed 2026-09-08: 1.93 is past
      # upstream's support window (EOL 2026-03-06; current stable 1.98) but carries no known
      # advisory (NVD returns 0 records for 1.93.1). Held deliberately — AAP 0.5.1 and 0.4.1
      # C8 fix 1.93 as the CI-tested toolchain, the README's Rust row says the same, and
      # commit f7163dd27 already reverted an unauthorized rustup bump. Refresh both pins and
      # that README row together. The rustup-init archive is version-pinned and its sha256 is
      # checked below, so this fetch is already reproducible and verified.
      run: |
          curl -O https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init
          echo "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10 rustup-init" | sha256sum -c
          chmod +x rustup-init
          ./rustup-init -y --default-toolchain 1.93 --target ${{ matrix.toolchain.rust_host }}
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    - name: configure git
      run: git config --global --add safe.directory '*'
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0
        submodules: recursive
# Most volatile cache
    - name: restore ccache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: ccache-restore
      with:
        path: ~/.cache/ccache
        key: ccache-${{ matrix.toolchain.host }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.toolchain.host }}-
# Less volatile cache
    - name: restore depends cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      id: depends-restore
      with:
        path: contrib/depends/built
        # Hash every depends build-id input (meta_depends + recipes + patches + toolchain template);
        # a missed input changes build ids under an unchanged key, so the save step below is skipped.
        key: depends-cxx23-${{ matrix.toolchain.host }}-${{ hashFiles('contrib/depends/packages/*', 'contrib/depends/patches/**', 'contrib/depends/Makefile', 'contrib/depends/funcs.mk', 'contrib/depends/hosts/*', 'contrib/depends/builders/*', 'contrib/depends/toolchain.cmake.in') }}
        restore-keys: depends-cxx23-${{ matrix.toolchain.host }}-
    - name: prepare w64-mingw32
      if: ${{ matrix.toolchain.host == 'x86_64-w64-mingw32' }}
      run: |
        update-alternatives --set ${{ matrix.toolchain.host }}-g++ $(which ${{ matrix.toolchain.host }}-g++-posix)
        update-alternatives --set ${{ matrix.toolchain.host }}-gcc $(which ${{ matrix.toolchain.host }}-gcc-posix)
    - uses: ./.github/actions/set-make-job-count
    - name: build
      run: |
        ${{env.CCACHE_SETTINGS}}
        make depends target=${{ matrix.toolchain.host }} -j${{env.MAKE_JOB_COUNT}}
    # Scans the depends output before it is written to the shared Actions cache, which is the
    # surface a local clone cannot reach: contrib/depends/built is exactly the tree the save
    # step below uploads and the restore step above unpacks into a later job. contrib/depends/work
    # holds each package's configure/build logs while a package is being built and is normally
    # removed as each one stages, so it is usually absent here and is scanned when it is not.
    # This step lives only in the depends jobs, which all run in a Linux container with GNU
    # grep; the macOS, Windows (msys2) and Arch jobs in build.yml are deliberately not covered,
    # because portable shell for those runners is not worth it for a low-severity coverage gap.
    - name: scan build output for leaked secrets
      run: |
        set -euo pipefail
        # High-precision indicators only: PEM key material and provider token formats. Generic
        # spellings such as "password =", "secret_key =" or "access_token=" are deliberately NOT
        # matched: they occur in this repository's own sources and fuzz corpora, so matching them
        # would fail the job on a false positive rather than on a leak.
        PATTERN='-----BEGIN( [A-Z]+)* PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36,}|AKIA[0-9A-Z]{16}|xox[abpr]-[0-9A-Za-z-]{10,}|AIza[0-9A-Za-z_-]{35}'
        rc=0
        for target in contrib/depends/built contrib/depends/work; do
          if [ ! -e "$target" ]; then
            echo "secret scan: ${target} absent, nothing to scan"
            continue
          fi
          # grep exits 0 on a match, 1 on no match and >1 on error; an error must fail the job
          # rather than be reported as clean.
          hits=$(grep -rIlE -e "$PATTERN" -- "$target") && grc=0 || grc=$?
          case "$grc" in
            0)
              echo "::error::possible key material or access token found under ${target}"
              printf '%s\n' "$hits"
              rc=1
              ;;
            1)
              echo "secret scan clean: ${target}"
              ;;
            *)
              echo "::error::secret scan could not read ${target} (grep exit ${grc})"
              rc=1
              ;;
          esac
        done
        exit "$rc"
    - name: save ccache
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/ccache
        key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
    - name: save depends cache
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: github.event_name != 'pull_request' && steps.depends-restore.outputs.cache-hit != 'true'
      with:
        path: contrib/depends/built
        key: ${{ steps.depends-restore.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: ${{ matrix.toolchain.host == 'x86_64-w64-mingw32' || matrix.toolchain.host == 'x86_64-apple-darwin' || matrix.toolchain.host == 'arm64-apple-darwin' || matrix.toolchain.host == 'x86_64-unknown-linux-gnu' }}
      with:
        name: ${{ matrix.toolchain.name }}
        path: |
          build/${{ matrix.toolchain.host }}/release/bin/monero-wallet-cli*
          build/${{ matrix.toolchain.host }}/release/bin/monerod*
