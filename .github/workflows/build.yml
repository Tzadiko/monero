name: ci/gh-actions/cli

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/README.md'

# Least-privilege GITHUB_TOKEN; actions/cache and upload-artifact use the runtime token, not GITHUB_TOKEN
permissions:
  contents: read

# The below variables reduce repetitions across similar targets
env:
  REMOVE_BUNDLED_PACKAGES : sudo rm -rf /usr/local
  # ARCH="default" (not "native") ensures, that a different execution host can execute binaries compiled elsewhere.
  BUILD_DEFAULT: 'cmake -S . -B build -D ARCH="default" -D BUILD_TESTS=ON -D BUILD_GUI_DEPS=ON -D ENABLE_FUZZ_TEST=ON -D CMAKE_BUILD_TYPE=Release && cmake --build build --target all'
  APT_INSTALL_LINUX: 'apt -y install build-essential g++-14 cmake libboost-all-dev libunbound-dev graphviz doxygen libunwind-dev pkg-config libssl-dev libzmq3-dev libsodium-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler ccache curl git'
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF
  CCACHE_SETTINGS: |
    ccache --max-size=150M
  CTEST_EXCLUDE_SLOW: |
    cd build
    env GTEST_FILTER="-DNSResolver.*:AddressFromURL.*:select_outputs.*" ctest --output-on-failure -E "functional_tests_rpc|core_tests|cnv4-jit|hash-variant2-int-sqrt|wide_difficulty"
  USE_DEVICE_TREZOR_MANDATORY: ON
  INSTALL_RUST: |
    curl -O https://static.rust-lang.org/rustup/archive/1.29.0/x86_64-unknown-linux-gnu/rustup-init
    echo "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10 rustup-init" | sha256sum -c
    chmod +x rustup-init
    ./rustup-init -y --default-toolchain 1.93
    echo "$HOME/.cargo/bin" >> $GITHUB_PATH

jobs:
  build-macos:
    name: 'macOS (brew)'
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: ccache-restore
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ccache-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-build-
      - uses: ./.github/actions/set-make-job-count
      - name: install dependencies
        run: |
          brew uninstall cmake
          brew update
          brew install --quiet cmake boost hidapi openssl zmq unbound protobuf ccache
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: |
          ${{env.CCACHE_SETTINGS}}
          ${{env.BUILD_DEFAULT}}
      - name: reduced tests
        run: ${{env.CTEST_EXCLUDE_SLOW}}
      - name: save ccache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true'
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  build-windows:
    name: 'Windows (MSYS2)'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: ccache-restore
        with:
          path: C:\Users\runneradmin\AppData\Local\ccache
          key: ccache-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-build-
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ucrt64
          update: true
          cache: false
          pacboy: toolchain:p cmake:p ccache:p boost:p openssl:p zeromq:p libsodium:p hidapi:p protobuf:p libusb:p unbound:p rust:p git:p
      - uses: ./.github/actions/set-make-job-count
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: |
          ${{env.CCACHE_SETTINGS}}
          ${{env.BUILD_DEFAULT}}
      - name: reduced tests
        run: ${{env.CTEST_EXCLUDE_SLOW}}
      - name: save ccache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true'
        with:
          path: C:\Users\runneradmin\AppData\Local\ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  build-arch:
    name: 'Arch Linux'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: install dependencies
        run: pacman -Syyu --noconfirm base-devel git rust cmake boost boost-libs openssl zeromq unbound libsodium readline expat gtest python3 doxygen graphviz hidapi libusb protobuf ccache
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: ccache-restore
        with:
          path: ~/.cache/ccache
          key: ccache-arch-build-${{ github.sha }}
          restore-keys: ccache-arch-build-
      - uses: ./.github/actions/set-make-job-count
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: |
          ${{ env.CCACHE_SETTINGS }}
          ${{ env.BUILD_DEFAULT }}
      - name: save ccache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  build-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Debian version (the C++23 build requires GCC 13 or newer; Debian 13 ships GCC 14.2)
          - name: Debian 13
            container: debian:13
            digest: sha256:9cc080028c43b27d2074d63a5f9caf7166d731494965616c1a6d2827a004585c
          # Oldest supported Ubuntu LTS version (default GCC 13.3; GCC 14.2 is packaged as g++-14)
          - name: Ubuntu 24.04
            container: ubuntu:24.04
            digest: sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    container:
      # Official image tag plus its multi-arch index digest (also test-ubuntu, source-archive); refresh both together from `docker buildx imagetools inspect <tag>`
      image: ${{ matrix.container }}@${{ matrix.digest }}
      env:
        DEBIAN_FRONTEND: noninteractive
        # GCC 14.2 is the reference compiler; CMake reads CC/CXX at configure time
        CC: gcc-14
        CXX: g++-14
    steps:
      - name: set apt conf
        run: ${{env.APT_SET_CONF}}
      - name: update apt
        run: apt update
      - name: install monero dependencies
        run: ${{env.APT_INSTALL_LINUX}}
      - name: install rust
        run: ${{env.INSTALL_RUST}}
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: ccache-restore
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.container }}-build-${{ github.sha }}
          restore-keys: ccache-${{ matrix.container }}-build-
      - uses: ./.github/actions/set-make-job-count
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: |
          ${{env.CCACHE_SETTINGS}}
          ${{env.BUILD_DEFAULT}}
      - name: save ccache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  test-ubuntu:
    name: "${{ matrix.name }} (tests)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Most popular Ubuntu LTS version
          - name: Ubuntu 24.04
            container: ubuntu:24.04
            digest: sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
    container:
      image: ${{ matrix.container }}@${{ matrix.digest }}
      env:
        DEBIAN_FRONTEND: noninteractive
        # GCC 14.2 is the reference compiler; CMake reads CC/CXX at configure time,
        # including the reduced-iteration core_tests reconfigure below
        CC: gcc-14
        CXX: g++-14
      # Setting up a loop device (losetup) requires additional capabilities.
      # tests/create_test_disks.sh
      options: --privileged
    steps:
      - name: set apt conf
        run: ${{env.APT_SET_CONF}}
      - name: update apt
        run: apt update
      - name: install monero dependencies
        run: ${{env.APT_INSTALL_LINUX}}
      - name: install rust
        run: ${{env.INSTALL_RUST}}
      - name: install pip
        run: apt install -y python3-pip
      - name: install Python dependencies
        env:
          # Complete pinned set, transitive dependencies included, each held to the sha256 of its
          # PyPI wheels for CPython 3.12 on x86_64 Linux; pyzmq provides the zmq module
          PYTHON_REQUIREMENTS: |
            certifi==2026.7.22 \
                --hash=sha256:62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775
            charset-normalizer==3.5.2 \
                --hash=sha256:3d31298449090ab8d47b7b1b2a555ff73cac7ed438a08b7ac160980c7ebed649 \
                --hash=sha256:1c50fe28bbc2ced33386f298650d91218076c05420e6cbd790b913adc41659e7 \
                --hash=sha256:b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685
            deepdiff==8.6.2 \
                --hash=sha256:4d22034a866c3928303a9332c279362f714192d9305bac17c498720d095fd1b4
            idna==3.20 \
                --hash=sha256:ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
            monotonic==1.6 \
                --hash=sha256:68687e19a14f11f26d140dd5c86f3dba4bf5df58003000ed467e0e2a69bca96c
            orderly-set==5.5.0 \
                --hash=sha256:46f0b801948e98f427b412fcabb831677194c05c3b699b80de260374baa0b1e7
            psutil==7.2.2 \
                --hash=sha256:076a2d2f923fd4821644f5ba89f059523da90dc9014e85f8e45a5774ca5bc6f9
            pyzmq==25.1.2 \
                --hash=sha256:f8429b17cbb746c3e043cb986328da023657e79d5ed258b711c06a70c2ea7537 \
                --hash=sha256:02c9087b109070c5ab0b383079fa1b5f797f8d43e9a66c07a4b8b8bdecfd88ee
            requests==2.33.1 \
                --hash=sha256:4e6d1ef462f3626a1f0a0a9c42dd93c63bad33f9f1c1937509b8c5c8718ab56a
            urllib3==2.8.0 \
                --hash=sha256:0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
        run: |
          printf '%s\n' "$PYTHON_REQUIREMENTS" | python3 -m pip install --break-system-packages --require-hashes --only-binary=:all: --no-deps -r /dev/stdin
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: ccache-restore
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.container }}-build-${{ github.sha }}
          restore-keys: ccache-${{ matrix.container }}-build-
      - name: create dummy disk drives for testing
        run: tests/create_test_disks.sh >> $GITHUB_ENV
      - uses: ./.github/actions/set-make-job-count
      - name: build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: |
          ${{env.CCACHE_SETTINGS}}
          ${{env.BUILD_DEFAULT}}
      - name: run tests except core_tests
        env:
          DNS_PUBLIC: tcp
        run: ctest --test-dir build --output-on-failure -E core_tests
      - name: use reduced slow-hash iterations for core_tests
        if: github.event_name == 'pull_request'
        env:
          CFLAGS: -DMONERO_CRYPTO_SLOW_HASH_ITER=20
          CMAKE_BUILD_PARALLEL_LEVEL: ${{env.MAKE_JOB_COUNT}}
        run: |
          cmake -S . -B build --fresh -D ARCH="default" -D BUILD_TESTS=ON
          cmake --build build --target core_tests
      - name: run core_tests
        run: ctest --test-dir build --output-on-failure -R core_tests
      - name: save ccache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event_name != 'pull_request' && steps.ccache-restore.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

  build-docker:
    name: 'Docker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: build image
        run: docker build .

  source-archive:
    name: "source archive"
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: set apt conf
        run: ${{env.APT_SET_CONF}}
      - name: update apt
        run: apt update
      - name: install dependencies
        run: apt install -y git python3-pip
      - name: configure git
        run: git config --global --add safe.directory '*'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: archive
        env:
          # git-archive-all has no dependencies; its one wheel is held to a reviewed sha256
          GIT_ARCHIVE_ALL_REQUIREMENTS: |
            git-archive-all==1.23.1 \
                --hash=sha256:d9f9611f2df629de3df1d6f134955ced4c704cbc0e423d769a7c0e55a8484242
        run: |
          printf '%s\n' "$GIT_ARCHIVE_ALL_REQUIREMENTS" | pip install --require-hashes --only-binary=:all: --no-deps -r /dev/stdin
          export VERSION="monero-$(git describe)"
          export OUTPUT="$VERSION.tar"
          echo "OUTPUT=$OUTPUT" >> $GITHUB_ENV
          git-archive-all --prefix "$VERSION/" --force-submodules "$OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.OUTPUT }}
          path: ${{ env.OUTPUT }}
